name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tools
        run: make tools
      - name: Format check
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build
      - name: Conformance
        run: make conformance GCCLI_BIN=bin/gccli

  darwin-cgo-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The Linux test job runs internal/cmd. It has no darwin-specific code.
      - name: Test all packages except internal/cmd
        run: make test-other-packages
      - name: Build (Keychain / cgo)
        run: CGO_ENABLED=1 go build ./cmd/gccli
