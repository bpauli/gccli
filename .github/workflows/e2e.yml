name: e2e

on:
  push:
    branches: [main]
    paths:
      - "internal/garminapi/**"
      - "internal/garminauth/**"
      - "internal/e2e/**"
      - "internal/units/**"
      - "go.mod"
      - ".github/workflows/e2e.yml"
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start SSH SOCKS proxy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/proxy_key
          chmod 600 ~/.ssh/proxy_key
          ssh -o StrictHostKeyChecking=no -D 1080 -f -N -i ~/.ssh/proxy_key gccli@46.225.30.1
      - name: Run E2E tests
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          HTTP_PROXY: socks5://localhost:1080
          HTTPS_PROXY: socks5://localhost:1080
          GCCLI_RECORD_DIR: ${{ github.event_name == 'schedule' && format('{0}/recorded-raw', runner.temp) || '' }}
        run: make test-e2e
      - name: Scrub recorded responses
        id: scrub
        if: github.event_name == 'schedule' && !cancelled()
        run: go run ./conformance/cmd/scrub "$RUNNER_TEMP/recorded-raw" "$RUNNER_TEMP/recorded"
      - name: Pack recorded fixtures
        if: ${{ !cancelled() && steps.scrub.outcome == 'success' }}
        run: tar -czf "$RUNNER_TEMP/recorded-fixtures.tgz" -C "$RUNNER_TEMP" recorded
      - name: Upload recorded fixtures
        if: ${{ !cancelled() && steps.scrub.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: recorded-fixtures
          path: ${{ runner.temp }}/recorded-fixtures.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Replay recorded fixtures
        if: ${{ !cancelled() && steps.scrub.outcome == 'success' }}
        env:
          GCCLI_RECORDED_DIR: ${{ runner.temp }}/recorded
        run: |
          make build
          GCCLI_BIN="$PWD/bin/gccli" go test -tags=conformance -count=1 -run TestRecorded ./conformance/
